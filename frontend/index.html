<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="./icons/shrimp(1).png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>SHRIMP*</title>
        <script>
            // Load theme before React starts to avoid flash of wrong theme
            (async function () {
                try {
                    const res = await fetch(`http://${window.location.hostname || 'localhost'}:8000/settings/theme`);
                    if (res.ok) {
                        const data = await res.json();
                        document.documentElement.className = `theme-${data.theme}`;
                    }
                } catch (e) {
                    // If fetch fails, fallback will be set by React
                    console.warn('Failed to preload theme:', e);
                }
            })();
        </script>
        <script>
            // Simple iOS keyboard detection
            // Only adds bottom padding to messages area, doesn't resize app
            (function () {
                if (!window.visualViewport) return;

                let lastHeight = window.visualViewport.height;

                function checkKeyboard() {
                    const vvHeight = window.visualViewport.height;
                    const windowHeight = window.innerHeight;
                    const keyboardHeight = Math.max(0, windowHeight - vvHeight);

                    // Only update if height actually changed
                    if (vvHeight !== lastHeight) {
                        lastHeight = vvHeight;

                        // Add padding to messages to prevent keyboard overlap
                        const messages = document.querySelector('.messages');
                        if (messages && keyboardHeight > 0) {
                            messages.style.paddingBottom = `${keyboardHeight + 16}px`;
                        } else if (messages) {
                            messages.style.paddingBottom = '';
                        }

                        console.log('Keyboard:', keyboardHeight > 0 ? `${keyboardHeight}px` : 'closed');
                    }
                }

                // Check on viewport changes
                window.visualViewport.addEventListener('resize', checkKeyboard);
                window.visualViewport.addEventListener('scroll', checkKeyboard);

                // Poll when input focused (Safari resize events are unreliable)
                let pollTimer = null;
                document.addEventListener('focusin', (e) => {
                    if (e.target.matches('input, textarea')) {
                        pollTimer = setInterval(checkKeyboard, 150);
                    }
                });

                document.addEventListener('focusout', (e) => {
                    if (e.target.matches('input, textarea')) {
                        if (pollTimer) clearInterval(pollTimer);
                        setTimeout(checkKeyboard, 300);
                    }
                });
            })();
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>

</html>
