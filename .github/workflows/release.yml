name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header

  build-linux:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        env:
          ELECTRON: '1'
        run: cd frontend && npm run build

      - name: Create default config
        run: cp backend/config.py.example backend/config.py

      - name: Build Linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Override to AppImage only — pacman target requires Arch and makepkg
        run: npx electron-builder --linux AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/SHRIMP-*.AppImage
          body: ${{ needs.changelog.outputs.content }}
          draft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    needs: changelog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m venv .venv
          .venv\Scripts\pip.exe install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        env:
          ELECTRON: '1'
        run: cd frontend && npm run build

      - name: Create default config
        run: cp backend/config.py.example backend/config.py

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/SHRIMP*.exe
          body: ${{ needs.changelog.outputs.content }}
          draft: false
          prerelease: false

  publish-aur:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Extract version (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for AppImage and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          DOWNLOAD_URL=""
          for i in $(seq 1 18); do
            ASSET_NAME=$(gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep '\.AppImage$' || true)
            if [ -n "$ASSET_NAME" ]; then
              DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
              echo "Asset found: $DOWNLOAD_URL"; break
            fi
            echo "Waiting for AppImage... ($i/18)"
            sleep 10
          done
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: AppImage asset not found after 3 minutes" && exit 1
          fi
          curl -L --fail --output appimage.tmp "$DOWNLOAD_URL"
          SIZE=$(stat -c%s appimage.tmp)
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: Downloaded file is only ${SIZE} bytes — expected >10MB AppImage" && exit 1
          fi
          SHA256=$(sha256sum appimage.tmp | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Set up SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_ed25519
            User aur
            StrictHostKeyChecking no
          EOF

      - name: Publish shrimp to AUR
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          git clone ssh://aur@aur.archlinux.org/shrimp.git /tmp/aur-shrimp
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur/shrimp/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/shrimp/PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${SHA256}')|" aur/shrimp/PKGBUILD
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" aur/shrimp/.SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" aur/shrimp/.SRCINFO
          sed -i "s|source = .*|source = SHRIMP-${VERSION}.AppImage::https://github.com/${{ github.repository }}/releases/download/v${VERSION}/SHRIMP-${VERSION}.AppImage|" aur/shrimp/.SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = ${SHA256}/" aur/shrimp/.SRCINFO
          cp aur/shrimp/PKGBUILD aur/shrimp/.SRCINFO aur/shrimp/shrimp.install /tmp/aur-shrimp/
          cd /tmp/aur-shrimp
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO shrimp.install
          git diff --cached --quiet || git commit -m "Update to v${VERSION}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519" git push origin master

      - name: Publish shrimp-bin stub to AUR
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git clone ssh://aur@aur.archlinux.org/shrimp-bin.git /tmp/aur-shrimp-bin
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur/shrimp-bin/PKGBUILD
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" aur/shrimp-bin/.SRCINFO
          cp aur/shrimp-bin/PKGBUILD aur/shrimp-bin/.SRCINFO /tmp/aur-shrimp-bin/
          cd /tmp/aur-shrimp-bin
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to v${VERSION}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519" git push origin master

      - name: Sync updated AUR files back to dev
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout dev
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur/shrimp/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/shrimp/PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${SHA256}')|" aur/shrimp/PKGBUILD
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" aur/shrimp/.SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" aur/shrimp/.SRCINFO
          sed -i "s|source = .*|source = SHRIMP-${VERSION}.AppImage::https://github.com/${{ github.repository }}/releases/download/v${VERSION}/SHRIMP-${VERSION}.AppImage|" aur/shrimp/.SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = ${SHA256}/" aur/shrimp/.SRCINFO
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur/shrimp-bin/PKGBUILD
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" aur/shrimp-bin/.SRCINFO
          git add aur/shrimp/PKGBUILD aur/shrimp/.SRCINFO aur/shrimp-bin/PKGBUILD aur/shrimp-bin/.SRCINFO
          git diff --cached --quiet || git commit -m "chore(aur): sync pkgver to v${VERSION}"
          git push origin dev
